<!doctype html>

  <title>Fantaszy Szentre</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div class="app-shell">
    <header class="topbar">

        <div class="brand-mark">FS</div>

          <div class="brand-tagline">Smarter Fantasy Decisions</div>

        <button class="icon-button" id="refreshBtn" aria-label="Refresh data">↻</button>
      </div>
    </header>

    <main>
      <section id="overview" class="view active"></section>
      <section id="players" class="view"></section>
      <section id="teams" class="view"></section>
      <section id="transfers" class="view"></section>
      <section id="weekly" class="view"></section>
      <section id="market" class="view"></section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-view="overview"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-view="players"><span>◫</span><small>Players</small></button>
      <button class="nav-item" data-view="teams"><span>XI</span><small>My Teams</small></button>
      <button class="nav-item" data-view="transfers"><span>⇄</span><small>Transfers</small></button>

      <button class="nav-item" data-view="market"><span>↗</span><small>Market</small></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <script src="accuracy-ui.js?v=20260901-accuracy1"></script>
