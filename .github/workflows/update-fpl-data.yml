name: Update FPL data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-fpl-data.yml'
      - 'scripts/update_fpl_data.py'
      - 'scripts/collect_lineup_intel.py'
      - 'scripts/validate_lineup_intel.py'
      - 'scripts/build_accuracy.py'
      - 'scripts/build_szxp22.py'
      - 'scripts/build_accuracy22.py'
      - 'scripts/build_szxp30.py'
      - 'scripts/build_accuracy30.py'
      - 'scripts/promote_szxp30.py'
      - 'data/intelligence/manual-signals.json'
      - 'data-adapter.js'
      - 'app.js'
      - 'sentre-commercial-core.js'
      - 'accuracy-ui.js'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: update-fpl-data-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SZxP 2.1 legacy baseline
        run: python scripts/update_fpl_data.py

      - name: Collect pre-deadline lineup intelligence
        run: python scripts/collect_lineup_intel.py
        continue-on-error: true

      - name: Validate lineup intelligence
        run: python scripts/validate_lineup_intel.py
        continue-on-error: true

      - name: Build SZxP 2.2 shadow
        run: python scripts/build_szxp22.py

      - name: Build SZxP 3.0 Commercial Core
        run: python scripts/build_szxp30.py

      - name: Score SZxP 2.1 legacy accuracy
        run: python scripts/build_accuracy.py

      - name: Score SZxP 2.2 shadow accuracy
        run: python scripts/build_accuracy22.py

      - name: Score SZxP 3.0 production accuracy
        run: python scripts/build_accuracy30.py

      - name: Promote SZxP 3.0 to canonical website feed
        run: python scripts/promote_szxp30.py

      - name: Commit refreshed data and prediction snapshots
        run: |
          git config user.name "fantaszy-szentre-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update FPL data and Szentre models"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "Push failed after 3 attempts"
          exit 1
