name: Update FPL data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-fpl-data.yml'
      - 'scripts/update_fpl_data.py'
      - 'scripts/build_accuracy.py'
      - 'scripts/build_szxp22.py'
      - 'scripts/build_accuracy22.py'
      - 'scripts/promote_szxp22.py'
      - 'data/intelligence/**'
      - 'data-adapter.js'
      - 'app.js'
      - 'accuracy-ui.js'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: update-fpl-data-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SZxP 2.1 shadow
        run: python scripts/update_fpl_data.py

      - name: Build SZxP 2.2 production
        run: python scripts/build_szxp22.py

      - name: Score confirmed SZxP 2.1 shadow accuracy
        run: python scripts/build_accuracy.py

      - name: Score confirmed SZxP 2.2 production accuracy
        run: python scripts/build_accuracy22.py

      - name: Promote SZxP 2.2 to canonical website feed
        run: python scripts/promote_szxp22.py

      - name: Commit refreshed data and prediction snapshots
        run: |
          git config user.name "fantaszy-szentre-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update FPL data and SZxP"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "Push failed after 3 attempts"
          exit 1
