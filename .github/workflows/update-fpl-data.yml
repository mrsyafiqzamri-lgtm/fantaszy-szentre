name: Update FPL data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-fpl-data.yml'
      - 'scripts/update_fpl_data.py'
      - 'data-adapter.js'
      - 'app.js'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch FPL data and build SZxP 2.0
        run: python scripts/update_fpl_data.py

      - name: Commit refreshed data and prediction snapshots
        run: |
          git config user.name "fantaszy-szentre-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update FPL data and SZxP"
          git push
